<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Recovery and mobility</title>
  <desc id="desc">A calm mobility area with a client stretching on a mat, foam roller, towel and recovery tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e7eef9"/>
      <stop offset=".52" stop-color="#edf7ef"/>
      <stop offset="1" stop-color="#fff4e6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#344842"/>
      <stop offset="1" stop-color="#1d2c29"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6f87d8"/>
      <stop offset="1" stop-color="#315cbb"/>
    </linearGradient>
    <linearGradient id="top" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2b84b"/>
      <stop offset="1" stop-color="#e0653e"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#101b18" flood-opacity=".23"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .043"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="720" height="480" rx="24" fill="url(#bg)"/>
  <rect width="720" height="480" rx="24" filter="url(#grain)" opacity=".82"/>
  <path d="M0 346c105-29 227-34 366-12 142 22 260 12 354-30v176H0z" fill="url(#floor)"/>
  <path d="M92 402h536M158 445h404" stroke="#fff6e8" stroke-opacity=".22" stroke-width="6" stroke-linecap="round"/>

  <g opacity=".42" fill="none" stroke="#243330" stroke-linecap="round">
    <path d="M82 118h130M82 158h78M82 198h116" stroke-width="10"/>
    <path d="M540 116c44 16 70 47 78 92" stroke-width="10"/>
    <path d="M517 166c32 7 52 27 60 58" stroke-width="8"/>
    <path d="M488 108h24v98h-24z" stroke-width="9" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="138" y="352" width="448" height="50" rx="25" fill="url(#mat)"/>
    <path d="M176 376h372" stroke="#ffffff" stroke-opacity=".22" stroke-width="6" stroke-linecap="round"/>

    <circle cx="308" cy="218" r="33" fill="#ffe7d4"/>
    <path d="M290 252c-42 31-76 68-102 111" stroke="#ffe7d4" stroke-width="21" stroke-linecap="round"/>
    <path d="M335 252c45 28 90 52 134 73" stroke="#ffe7d4" stroke-width="21" stroke-linecap="round"/>
    <path d="M190 362c-39 3-73 17-102 43" stroke="#0f766e" stroke-width="24" stroke-linecap="round"/>
    <path d="M468 324c42 10 86 10 132 1" stroke="#0f766e" stroke-width="24" stroke-linecap="round"/>
    <path d="M264 287h116" stroke="url(#top)" stroke-width="32" stroke-linecap="round"/>
    <path d="M384 290c26 36 48 71 64 106" stroke="#ffe7d4" stroke-width="18" stroke-linecap="round"/>
    <path d="M442 397h78" stroke="#e0653e" stroke-width="13" stroke-linecap="round"/>

    <rect x="548" y="374" width="80" height="30" rx="15" fill="#f2b84b"/>
    <circle cx="568" cy="389" r="15" fill="#ffffff" opacity=".28"/>
    <rect x="92" y="332" width="78" height="22" rx="11" fill="#fff6e8" opacity=".84"/>
    <rect x="106" y="306" width="44" height="28" rx="10" fill="#315cbb"/>
  </g>

  <g opacity=".76">
    <path d="M579 238c18-22 38-22 58 0 18 22 18 48 0 70-20 22-40 22-58 0-18-22-18-48 0-70Z" fill="#0f766e" opacity=".16"/>
    <path d="M608 316V208M583 242c17 9 25 22 25 40M633 242c-17 9-25 22-25 40" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
