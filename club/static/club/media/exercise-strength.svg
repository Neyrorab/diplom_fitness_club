<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Strength training</title>
  <desc id="desc">A lifter squatting under a loaded barbell in a power rack with plates and gym markings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff5e8"/>
      <stop offset=".48" stop-color="#edf7f3"/>
      <stop offset="1" stop-color="#dde8fb"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#354942"/>
      <stop offset="1" stop-color="#1d2c29"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#162420"/>
      <stop offset=".5" stop-color="#42564f"/>
      <stop offset="1" stop-color="#162420"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2b84b"/>
      <stop offset="1" stop-color="#e0653e"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6f87d8"/>
      <stop offset="1" stop-color="#315cbb"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#101b18" flood-opacity=".25"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .04"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="720" height="480" rx="24" fill="url(#bg)"/>
  <rect width="720" height="480" rx="24" filter="url(#grain)" opacity=".8"/>
  <path d="M0 344c89-28 200-34 333-16 145 20 273 11 387-36v188H0z" fill="url(#floor)"/>
  <path d="M58 403h604M120 444h480" stroke="#fff6e8" stroke-opacity=".22" stroke-width="6" stroke-linecap="round"/>

  <g opacity=".42" fill="none" stroke="#20302d" stroke-linecap="round">
    <path d="M78 112h144M78 152h96M78 192h128" stroke-width="11"/>
    <path d="M544 94v238M614 94v238M522 332h114M522 124h114" stroke-width="12"/>
    <path d="M556 164h46M556 206h46M556 248h46" stroke-width="8"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M120 242h480" stroke="url(#bar)" stroke-width="16" stroke-linecap="round"/>
    <path d="M214 216v180M506 216v180" stroke="#192725" stroke-width="11" stroke-linecap="round"/>
    <path d="M188 216h52M480 216h52M190 396h50M480 396h52" stroke="#192725" stroke-width="13" stroke-linecap="round"/>

    <circle cx="106" cy="242" r="46" fill="url(#plate)"/>
    <circle cx="106" cy="242" r="25" fill="#20302d" opacity=".2"/>
    <circle cx="614" cy="242" r="46" fill="url(#plate)"/>
    <circle cx="614" cy="242" r="25" fill="#20302d" opacity=".2"/>
    <circle cx="158" cy="242" r="34" fill="#0f766e"/>
    <circle cx="562" cy="242" r="34" fill="#0f766e"/>

    <circle cx="348" cy="183" r="33" fill="#ffe7d4"/>
    <path d="M327 218c-28 25-45 59-51 101" stroke="#ffe7d4" stroke-width="21" stroke-linecap="round"/>
    <path d="M369 218c35 26 60 59 74 100" stroke="#ffe7d4" stroke-width="21" stroke-linecap="round"/>
    <path d="M278 318c-36 18-62 44-78 78" stroke="#0f766e" stroke-width="24" stroke-linecap="round"/>
    <path d="M442 318c34 19 58 46 72 82" stroke="#0f766e" stroke-width="24" stroke-linecap="round"/>
    <path d="M302 250h104" stroke="url(#shirt)" stroke-width="34" stroke-linecap="round"/>
    <path d="M278 284c-34 4-63-8-86-37" stroke="#ffe7d4" stroke-width="16" stroke-linecap="round"/>
    <path d="M425 284c36 5 70-6 101-34" stroke="#ffe7d4" stroke-width="16" stroke-linecap="round"/>
    <path d="M187 398h78M500 400h78" stroke="#e0653e" stroke-width="14" stroke-linecap="round"/>
  </g>

  <g opacity=".75">
    <rect x="72" y="365" width="34" height="58" rx="10" fill="#f2b84b"/>
    <rect x="112" y="344" width="34" height="79" rx="10" fill="#315cbb"/>
    <rect x="588" y="359" width="34" height="64" rx="10" fill="#e0653e"/>
    <rect x="630" y="335" width="34" height="88" rx="10" fill="#0f766e"/>
  </g>
</svg>
