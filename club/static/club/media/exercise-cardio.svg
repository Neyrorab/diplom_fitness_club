<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Cardio training</title>
  <desc id="desc">A client running on a treadmill with heart rate metrics and cardio equipment in a bright studio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#edf7f6"/>
      <stop offset=".5" stop-color="#f7f1e7"/>
      <stop offset="1" stop-color="#fce1d5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#344842"/>
      <stop offset="1" stop-color="#1c2a28"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset=".62" stop-color="#162420"/>
      <stop offset="1" stop-color="#315cbb"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2b84b"/>
      <stop offset="1" stop-color="#e0653e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#20302d"/>
      <stop offset="1" stop-color="#315cbb"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#101b18" flood-opacity=".24"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .045"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="720" height="480" rx="24" fill="url(#bg)"/>
  <rect width="720" height="480" rx="24" filter="url(#grain)" opacity=".82"/>
  <path d="M0 338c124-28 241-31 352-9 123 23 245 14 368-22v173H0z" fill="url(#floor)"/>
  <path d="M84 401h556M144 445h432" stroke="#fff6e8" stroke-opacity=".22" stroke-width="6" stroke-linecap="round"/>

  <g opacity=".45" fill="none" stroke="#25352f" stroke-linecap="round">
    <path d="M72 118h144M72 158h94M72 198h118" stroke-width="11"/>
    <path d="M516 106c47 13 79 40 98 82" stroke-width="11"/>
    <path d="M505 161c27 7 47 24 59 51" stroke-width="8"/>
    <path d="M510 242h102M510 274h68" stroke-width="10"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="124" y="350" width="412" height="37" rx="18" fill="url(#belt)"/>
    <rect x="188" y="326" width="310" height="17" rx="9" fill="#fff6e8" opacity=".72"/>
    <circle cx="152" cy="386" r="25" fill="#192725"/>
    <circle cx="510" cy="386" r="25" fill="#192725"/>
    <path d="M492 350l61-112" stroke="#192725" stroke-width="12" stroke-linecap="round"/>
    <rect x="532" y="190" width="94" height="58" rx="14" fill="url(#screen)"/>
    <path d="M550 221h15l12-18 16 30 14-16" fill="none" stroke="#f2b84b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="310" cy="166" r="31" fill="#ffe7d4"/>
    <path d="M294 199c-32 28-56 64-73 108" stroke="#ffe7d4" stroke-width="20" stroke-linecap="round"/>
    <path d="M333 199c38 24 72 51 101 82" stroke="#ffe7d4" stroke-width="20" stroke-linecap="round"/>
    <path d="M224 306c-35 7-64 25-88 55" stroke="#315cbb" stroke-width="23" stroke-linecap="round"/>
    <path d="M362 290c39 28 68 62 87 101" stroke="#315cbb" stroke-width="23" stroke-linecap="round"/>
    <path d="M258 229h106" stroke="url(#shirt)" stroke-width="32" stroke-linecap="round"/>
    <path d="M418 280l67 34" stroke="#ffe7d4" stroke-width="16" stroke-linecap="round"/>
    <path d="M136 361h78M438 391h78" stroke="#e0653e" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g opacity=".72" fill="none" stroke-linecap="round">
    <path d="M406 118c35 13 60 35 76 66" stroke="#0f766e" stroke-width="8"/>
    <path d="M430 89c42 14 73 40 93 78" stroke="#315cbb" stroke-width="7"/>
    <path d="M175 255h70M161 285h48" stroke="#ffffff" stroke-opacity=".55" stroke-width="7"/>
  </g>
</svg>
