{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход - ИС Фитнес-клуб</title>
    <link rel="stylesheet" href="{% static 'club/styles.css' %}?v=20260521-logo6">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-visual login-logo-visual">
            <div class="login-logo-stage" aria-hidden="true">
                <img class="login-logo-large" src="{% static 'club/media/pulse-brain-logo-clean.svg' %}" alt="">
                <svg class="login-logo-signal" viewBox="0 0 836 528" focusable="false">
                    <defs>
                        <linearGradient id="login-signal-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
                            <stop offset="38%" stop-color="#a7f3d0" />
                            <stop offset="58%" stop-color="#ffffff" />
                            <stop offset="76%" stop-color="#22c55e" />
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                        </linearGradient>
                    </defs>
                    <path class="login-logo-signal-glow" pathLength="1000" d="M58 298 H105 C119 298 121 282 130 264 C138 248 147 248 154 268 L168 319 L200 111 L238 433 L257 334 C263 312 274 298 297 298 H338 C370 298 386 276 424 260 C482 220 552 218 612 250 C654 272 714 281 778 270" />
                </svg>
            </div>
            <div class="login-visual-copy">
                <p class="eyebrow">Фитнес-клуб</p>
                <h1>Рабочее место для тренеров, клиентов и администратора</h1>
            </div>
        </section>
        <section class="login-card">
            <div class="brand login-brand">
                <span class="brand-mark brand-logo-mark">
                    <img src="{% static 'club/media/pulse-brain-logo-clean.svg' %}" alt="">
                </span>
                <span>
                    <strong>ИС Фитнес-клуб</strong>
                    <small>учет тренировок и питания</small>
                </span>
            </div>
            {% if form.errors %}
                <div class="message error">Неверный логин или пароль.</div>
            {% endif %}
            <form method="post" class="stack">
                {% csrf_token %}
                <label>
                    Логин
                    {{ form.username }}
                </label>
                <label>
                    Пароль
                    {{ form.password }}
                </label>
                <button class="btn btn-primary" type="submit">Войти</button>
            </form>
        </section>
    </main>
</body>
</html>
